<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoe &amp; Eva's Magic Music Box</title>
<meta name="description" content="A sparkly rainbow music player for Zoe & Eva's songs.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦄</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Twinkling sky background -->
<div class="sky" aria-hidden="true">
  <div class="stars"></div>
  <div class="stars stars--big"></div>
  <div class="cloud cloud--1">☁️</div>
  <div class="cloud cloud--2">☁️</div>
  <div class="cloud cloud--3">☁️</div>
  <div class="sparkle sparkle--1">✨</div>
  <div class="sparkle sparkle--2">✨</div>
  <div class="sparkle sparkle--3">✨</div>
  <div class="sparkle sparkle--4">✨</div>
</div>

<div class="page">

  <header class="hero">
    <p class="hero__eyebrow">✨ a magical place for ✨</p>
    <h1 class="hero__title">Zoe &amp; Eva's<br><span>Music Box</span></h1>
    <p class="hero__subtitle">Press play and let the rainbow carry the tune 🦄</p>
  </header>

  <main>

    <!-- PLAYER -->
    <section class="player" id="player">

      <div class="player__art" id="albumArt">
        <div class="art-ring"></div>
        <div class="art-unicorn">🦄</div>
      </div>

      <h2 class="player__title" id="trackTitle">Loading songs&hellip;</h2>
      <p class="player__artist" id="trackArtist">&nbsp;</p>

      <!-- Rainbow arc progress -->
      <div class="rainbow-wrap">
        <svg class="rainbow-svg" viewBox="0 0 400 190" id="rainbowSvg" aria-hidden="true">
          <!-- rainbow bands (back to front) drawn by JS -->
          <g id="rainbowBands"></g>
          <!-- glowing progress overlay -->
          <path id="progressArc" class="progress-arc" d="" fill="none" />
        </svg>
        <div class="rainbow-runner" id="rainbowRunner">🦄</div>
      </div>

      <div class="time-row">
        <span id="timeCurrent">0:00</span>
        <span id="timeDuration">0:00</span>
      </div>

      <div class="controls">
        <button class="btn-icon" id="prevBtn" title="Previous song" aria-label="Previous song">⏮</button>

        <button class="btn-star" id="playBtn" title="Play" aria-label="Play">
          <svg viewBox="0 0 24 24" id="playIcon"><polygon points="6,4 20,12 6,20"></polygon></svg>
          <svg viewBox="0 0 24 24" id="pauseIcon" style="display:none"><rect x="5" y="4" width="5" height="16" rx="1.5"></rect><rect x="14" y="4" width="5" height="16" rx="1.5"></rect></svg>
        </button>

        <button class="btn-icon" id="nextBtn" title="Next song" aria-label="Next song">⏭</button>

        <button class="btn-icon btn-cast" id="castBtn" title="Cast to TV" aria-label="Cast to TV">
          <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm18-7H5v1.63c3.96 1.28 7.09 4.41 8.37 8.37H19V7zM1 10v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        </button>
      </div>

      <p class="cast-status" id="castStatus"></p>
    </section>

    <!-- TRACK LIST -->
    <section class="tracklist" aria-label="Song list">
      <h2 class="section-title">All the songs 🎵</h2>
      <ul class="tracklist__list" id="trackList"></ul>
    </section>

  </main>

  <footer class="footer">
    <p>Made with sparkles, glitter, and a little bit of magic ✨🦄🌈</p>
  </footer>

</div>

<audio id="audio" preload="metadata"></audio>

<!-- Google Cast Sender SDK -->
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<script src="js/app.js"></script>
</body>
</html>
